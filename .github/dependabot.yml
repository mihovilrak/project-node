version: 2
updates:
  # Actions are pinned to commit SHAs, so this is what moves them forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Dockerfile base images (node, nginx), pinned by tag and digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # postgres in docker-compose.yml. The same pin in ci.yml's service container
  # is not tracked by Dependabot; keep it in step by hand.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
