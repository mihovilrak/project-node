# Passwords are Docker secrets read from ./secrets/*.txt (create them with
# scripts/init-secrets.sh or scripts/init-secrets.ps1) and exposed to the
# containers as *_FILE paths. Outside Swarm, secrets are plain bind mounts and
# the uid/gid/mode options are ignored, so the host files must be readable by
# the container users (postgres, nginx): chmod 0644 or 0444.
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt
  admin_password:
    file: ./secrets/admin_password.txt
  session_secret:
    file: ./secrets/session_secret.txt
  email_password:
    file: ./secrets/email_password.txt

x-db: &db
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

# The API and notification service connect as the non-superuser role that
# the migrate service creates; the superuser is only used by db, migrate and backup.
x-app-db: &app-db
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${APP_DB_USER:-pm_app}
  POSTGRES_PASSWORD_FILE: /run/secrets/app_db_password

# Only the SMTP credentials stay outside the database; host, port, sender and
# the on/off switch are edited in the admin UI and stored in app_settings.
x-email: &email
  EMAIL_USER: ${EMAIL_USER}
  EMAIL_PASSWORD_FILE: /run/secrets/email_password

x-defaults: &defaults
  restart: unless-stopped
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:mode=1777

# APP_IMAGE defaults to the published image; the tag only exists once a matching
# v* git tag is pushed. Build locally with `docker compose build` (or
# `docker build -t project-node:dev .`) and set APP_IMAGE to use your own build.
x-app: &app
  <<: *defaults
  image: ${APP_IMAGE:-ghcr.io/mihovilrak/project-node:1.0.0}
  build: .
  user: nginx
  init: true

services:
  db:
    <<: *defaults
    image: postgres:18.6-alpine3.23@sha256:f1031bf693d8d60b0a0380c51a3510607c7a93c7c1d18bf7af94a3a8dbeb40b8
    user: postgres
    networks:
      - backend
    mem_limit: 512m
    cpus: 1.0
    environment:
      <<: *db
      PGTZ: ${TZ}
    secrets:
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:uid=70,gid=70,mode=0775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: applies db/init, (re)creates the app role and seeds the admin.
  migrate:
    <<: *app
    restart: "no"
    networks:
      - backend
    mem_limit: 256m
    command: ["/app/db/migrate.sh"]
    environment:
      <<: *db
      POSTGRES_HOST: db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      ADMIN_PASSWORD_FORCE_RESET: ${ADMIN_PASSWORD_FORCE_RESET:-false}
      APP_DB_USER: ${APP_DB_USER:-pm_app}
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - postgres_password
      - app_db_password
      - admin_password
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    networks:
      - backend
      - frontend
    mem_limit: 512m
    cpus: 1.0
    command: ["node", "/app/api/index.js"]
    environment:
      <<: [*app-db, *email]
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      FE_URL: ${FE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
    secrets:
      - app_db_password
      - session_secret
      - email_password
    volumes:
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  notifications:
    <<: *app
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.5
    command: ["node", "/app/service/index.js"]
    environment:
      <<: [*app-db, *email]
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ}
      FE_URL: ${FE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
    secrets:
      - app_db_password
      - email_password
    healthcheck:
      # /ready gates on the database, /health on the cached SMTP probe.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5001/ready && wget -q -O /dev/null http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    networks:
      - frontend
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:3000:8080"
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0750
    healthcheck:
      # nginx only: /api/health would mark web unhealthy whenever api is down.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  # Daily pg_dump at BACKUP_TIME (HH:MM, TZ) into ./db/backup on the host.
  backup:
    <<: *app
    networks:
      - backend
    mem_limit: 128m
    cpus: 0.5
    entrypoint: ["sh", "/app/db/backup-scheduler.sh"]
    environment:
      <<: *db
      POSTGRES_HOST: db
      BACKUP_TIME: ${BACKUP_TIME:-00:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: ${TZ}
    secrets:
      - postgres_password
    volumes:
      - ./db/backup:/backups
    depends_on:
      db:
        condition: service_healthy

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  app_uploads:
  db_data:
