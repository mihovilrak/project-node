openapi: 3.1.0
info:
  title: Project Node API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    REST API behind the Project Node web app. Every path is under `/api`.

    ## Authentication
    `POST /api/login` with `{ login, password }` starts a session. The server
    answers with a `connect.sid` cookie (HttpOnly). Send that cookie on every
    later request; the browser does it for you when requests are made with
    credentials. `POST /api/logout` ends the session. Without a valid session
    the protected routes answer `401 { "error": "Access denied" }`.

    Authorisation has two layers. Some routes need a named permission from the
    caller's role (see `x-required-permission` on the operation; `Admin`
    satisfies every check). Project, task and file routes also need the caller
    to be a member or the creator of the project involved; Admins bypass that.

    ## CSRF
    Every non-GET/HEAD/OPTIONS request under `/api` must carry
    `X-Requested-With: XMLHttpRequest`, otherwise it is rejected with
    `403 { "error": "Missing CSRF header" }`. This applies to login too.

    ## Pagination
    List endpoints that accept `limit` and `offset` return a plain JSON array
    (no envelope and no total count). `limit` defaults to 50 and is capped at
    500; `offset` defaults to 0. Invalid values fall back to the defaults.

    ## Errors
    Errors are JSON objects with an `error` string, sometimes with a
    `message` or `details`. Database errors are mapped as follows: a unique
    violation is `409`, a missing referenced row is `404`, an invalid value is
    `400`. Deleting or updating something that does not exist is `404`.
    Unexpected failures are `500 { "error": "Internal Server Error" }`.

    ## Data types
    `date` columns are `YYYY-MM-DD` strings, timestamps are ISO 8601 date-times.
    PostgreSQL `numeric` and `bigint` values (hours, progress, sizes, counts)
    arrive as strings.
servers:
  - url: http://localhost:5000
    description: Local development API
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and database connectivity.
  - name: Session
    description: Login, logout and the current session.
  - name: Projects
    description: Projects, members and subprojects.
  - name: Tasks
    description: Tasks, tags on tasks, watchers and task lookups.
  - name: Comments
    description: Comments on a task.
  - name: Files
    description: Task attachments.
  - name: Roles
    description: Roles and their permissions.
  - name: Users
    description: User accounts.
  - name: Notifications
    description: The signed-in user's notifications.
  - name: Tags
    description: Tag catalogue.
  - name: Profile
    description: The signed-in user's profile.
  - name: Admin
    description: Administration and reports.
  - name: Task Types
    description: Task type catalogue.
  - name: Activity Types
    description: Activity type catalogue for time logs.
  - name: Settings
    description: Application and user settings.
  - name: Time Logs
    description: Time logged against tasks.

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API and database health
      security: []
      responses:
        '200':
          description: The API can reach the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/check-session:
    get:
      tags: [Session]
      operationId: session
      summary: Return the current session user and permissions
      responses:
        '200':
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/login:
    post:
      tags: [Session]
      operationId: login
      summary: Log in and start a session
      description: |
        Rate limited to 20 requests per 15 minutes per IP (standard
        `RateLimit-*` headers). After repeated failures the account is locked
        for a while and the call answers `429` with `Retry-After`.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in. The response sets the `connect.sid` cookie.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
                examples: ['connect.sid=s%3A...; Path=/; HttpOnly']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: End the session and clear the cookie
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/projects/statuses:
    get:
      tags: [Projects]
      operationId: getProjectStatuses
      summary: List project statuses
      responses:
        '200':
          description: Project statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusOption'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects:
    get:
      tags: [Projects]
      operationId: getProjects
      summary: List projects the caller can access
      description: >-
        Only projects the caller is a member or creator of are returned
        (all projects for Admins). Defaults to active projects when
        `status_id` is not given.
      parameters:
        - name: status_id
          in: query
          schema: { type: integer }
        - name: created_by
          in: query
          schema: { type: integer }
        - name: parent_id
          in: query
          schema: { type: integer }
        - name: start_date_from
          in: query
          schema: { type: string, format: date }
        - name: start_date_to
          in: query
          schema: { type: string, format: date }
        - name: due_date_from
          in: query
          schema: { type: string, format: date }
        - name: due_date_to
          in: query
          schema: { type: string, format: date }
        - name: whereParams
          in: query
          description: JSON object with the same filter keys; replaces the individual filters when given.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: With `parent_id`, the caller also needs access to the parent project.
      x-required-permission: Create projects
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateInput'
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Projects]
      operationId: getProjectById
      summary: Get a project
      description: Requires access to the project (member, creator or Admin).
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      description: Requires access to the project. Unknown keys are ignored.
      x-required-permission: Edit projects
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateInput'
      responses:
        '200':
          description: Number of rows updated (always 1).
          content:
            application/json:
              schema:
                type: integer
                examples: [1]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: Soft delete; the project moves to the "deleted" status. Requires access to the project.
      x-required-permission: Delete projects
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Confirmation, e.g. `Project Apollo deleted.`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/details:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Projects]
      operationId: getProjectDetails
      summary: Get a project with names and time totals
      description: Requires access to the project.
      responses:
        '200':
          description: The project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Projects]
      operationId: changeProjectStatus
      summary: Change a project's status
      description: Requires access to the project.
      x-required-permission: Edit projects
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '`status` is accepted as an alias of `status_id`.'
              properties:
                status_id: { type: integer, minimum: 1 }
                status: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Confirmation, e.g. `Project status changed to active for project Apollo.`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Projects]
      operationId: getProjectTasks
      summary: List a project's tasks
      description: Requires access to the project.
      parameters:
        - name: status
          in: query
          description: Task status id.
          schema: { type: integer }
        - name: priority
          in: query
          description: Priority id.
          schema: { type: integer }
        - name: assignee
          in: query
          description: Assignee user id.
          schema: { type: integer }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/projects/{id}/members:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Projects]
      operationId: getProjectMembers
      summary: List project members
      description: Requires access to the project.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Projects]
      operationId: addProjectMember
      summary: Add a member to a project
      description: Requires access to the project.
      x-required-permission: Edit projects
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdInput'
      responses:
        '201':
          description: The new membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Projects]
      operationId: deleteProjectMember
      summary: Remove a member from a project
      description: Requires access to the project. The user id goes in the request body.
      x-required-permission: Edit projects
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdInput'
      responses:
        '200':
          description: Number of memberships removed (always 1).
          content:
            application/json:
              schema:
                type: integer
                examples: [1]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/subprojects:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Projects]
      operationId: getSubprojects
      summary: List direct subprojects
      description: Requires access to the project.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Subprojects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subproject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/tasks:
    get:
      tags: [Tasks]
      operationId: getTasks
      summary: List tasks the caller can access
      description: Boolean flags accept `1` or `true`.
      parameters:
        - { name: id, in: query, schema: { type: integer } }
        - { name: project_id, in: query, schema: { type: integer } }
        - { name: assignee_id, in: query, schema: { type: integer } }
        - { name: holder_id, in: query, schema: { type: integer } }
        - { name: status_id, in: query, schema: { type: integer } }
        - { name: priority_id, in: query, schema: { type: integer } }
        - { name: type_id, in: query, schema: { type: integer } }
        - { name: parent_id, in: query, schema: { type: integer } }
        - { name: created_by, in: query, schema: { type: integer } }
        - { name: due_date_from, in: query, schema: { type: string, format: date } }
        - { name: due_date_to, in: query, schema: { type: string, format: date } }
        - { name: start_date_from, in: query, schema: { type: string, format: date } }
        - { name: start_date_to, in: query, schema: { type: string, format: date } }
        - { name: created_from, in: query, schema: { type: string, format: date } }
        - { name: created_to, in: query, schema: { type: string, format: date } }
        - { name: estimated_time_min, in: query, schema: { type: number } }
        - { name: estimated_time_max, in: query, schema: { type: number } }
        - { name: inactive_statuses_only, in: query, schema: { type: string, enum: ['1', 'true'] } }
        - { name: active_statuses_only, in: query, schema: { type: string, enum: ['1', 'true'] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: Requires access to the project given in `project_id`.
      x-required-permission: Create tasks
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateInput'
      responses:
        '201':
          description: The id of the created task.
          content:
            application/json:
              schema:
                type: object
                required: [task_id]
                properties:
                  task_id: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/statuses:
    get:
      tags: [Tasks]
      operationId: getTaskStatuses
      summary: List task statuses
      responses:
        '200':
          description: Task statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusOption'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/priorities:
    get:
      tags: [Tasks]
      operationId: getPriorities
      summary: List task priorities
      responses:
        '200':
          description: Priorities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusOption'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/active:
    get:
      tags: [Tasks]
      operationId: getActiveTasks
      summary: List active tasks assigned to the caller
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/calendar:
    get:
      tags: [Tasks]
      operationId: getTasksByDateRange
      summary: List tasks overlapping a date range
      parameters:
        - name: start_date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end_date
          in: query
          required: true
          description: Must be on or after `start_date`.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Tasks]
      operationId: getTaskById
      summary: Get a task
      description: Requires access to the task's project.
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task
      description: >-
        Requires access to the task's project. Holder and assignee must be
        project members. Handled by the same controller as `patchTask`.
      x-required-permission: Edit tasks
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateInput'
      responses:
        '200':
          description: The updated task row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      operationId: patchTask
      summary: Partially update a task
      description: >-
        Same behaviour as `updateTask` (controller `updateTask`); only the given
        keys change.
      x-required-permission: Edit tasks
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateInput'
      responses:
        '200':
          description: The updated task row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      description: Soft delete. Requires access to the task's project.
      x-required-permission: Delete tasks
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The deleted task row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/subtasks:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Tasks]
      operationId: getSubtasks
      summary: List a task's subtasks
      description: Requires access to the task's project.
      responses:
        '200':
          description: Subtasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/tasks/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Tasks]
      operationId: getTaskTags
      summary: List a task's tags
