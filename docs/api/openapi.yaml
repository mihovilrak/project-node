        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/time-logs/projects/{projectId}/spent-time:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
    get:
      tags: [Time Logs]
      operationId: getProjectSpentTime
      summary: Total hours logged on a project
      description: Requires access to the project.
      responses:
        '200':
          $ref: '#/components/responses/SpentTime'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/time-logs/user/logs:
    get:
      tags: [Time Logs]
      operationId: getUserTimeLogs
      summary: List the caller's time logs
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ActivityTypeFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Time logs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeLogDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/time-logs/{timeLogId}:
    parameters:
      - name: timeLogId
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Time Logs]
      operationId: updateTimeLog
      summary: Update a time log
      description: Only the user who logged the time (or an Admin) may edit it.
      x-required-permission: Edit log
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeLogInput'
      responses:
        '200':
          description: The updated time log row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Time Logs]
      operationId: deleteTimeLog
      summary: Delete a time log
      description: Only the user who logged the time (or an Admin) may delete it.
      x-required-permission: Delete log
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Time log deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie set by `POST /api/login`.

  parameters:
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Required on every mutating request; without it the API answers 403.
      schema:
        type: string
        const: XMLHttpRequest
    Limit:
      name: limit
      in: query
      description: Page size. Invalid values fall back to the default.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      description: Rows to skip. Invalid values fall back to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    FileIdPath:
      name: fileId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TaskIdQuery:
      name: taskId
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    StartDate:
      name: startDate
      in: query
      description: Earliest `log_date`.
      schema: { type: string, format: date }
    EndDate:
      name: endDate
      in: query
      description: Latest `log_date`.
      schema: { type: string, format: date }
    ActivityTypeFilter:
      name: activity_type_id
      in: query
      schema: { type: integer, minimum: 1 }

  requestBodies:
    FileUpload:
      required: true
      description: >-
        One file in the `file` field, at most 10 MB. Allowed extensions: png,
        jpg, jpeg, gif, webp, bmp, pdf, txt, csv, md, json, doc, docx, xls,
        xlsx, ppt, pptx, odt, ods, zip; the MIME type must match the extension.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Access denied
    Forbidden:
      description: >-
        Missing CSRF header, missing permission, or no access to the
        project, task, file or record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Permission denied: Edit tasks required'
    NotFound:
      description: The resource, or a resource it references, does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A resource with the same unique value already exists, or the resource is still in use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Resource already exists
    TooManyRequests:
      description: Too many attempts.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FileDownload:
      description: The file contents, sent as an attachment.
      headers:
        Content-Disposition:
          description: '`attachment` with the original file name.'
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    IconList:
      description: Icon names.
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    SpentTime:
      description: Total hours.
      content:
        application/json:
          schema:
            type: object
            required: [spent_time]
            properties:
              spent_time: { type: number }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
        details: {}
        missingFields:
          type: array
          items: { type: string }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
    NumericString:
      type: string
      description: A PostgreSQL numeric or bigint value serialized as a string.
      pattern: '^-?\d+(\.\d+)?$'
      examples: ['12.50']
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, 'null']
      format: date-time
    Date:
      type: string
      format: date
    NullableDate:
      type: [string, 'null']
      format: date
    StatusOption:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: [string, 'null'] }
    UserIdInput:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, minimum: 1 }

    LoginInput:
      type: object
      required: [login, password]
      properties:
        login: { type: string, minLength: 1, maxLength: 255 }
        password: { type: string, format: password, minLength: 1, maxLength: 1024 }
    SessionUser:
      type: object
      required: [id, login, role_id]
      properties:
        id: { type: integer }
        login: { type: string }
        role_id: { type: integer }
    UserPermission:
      type: object
      required: [permission]
      properties:
        permission: { type: string }
    SessionInfo:
      type: object
      required: [user, permissions]
      properties:
        user: { $ref: '#/components/schemas/SessionUser' }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/UserPermission' }
    LoginResult:
      allOf:
        - $ref: '#/components/schemas/SessionInfo'
        - type: object
          required: [message]
          properties:
            message: { type: string, const: Login successful }

    Project:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 50 }
        description: { type: [string, 'null'] }
        start_date: { $ref: '#/components/schemas/Date' }
        end_date: { $ref: '#/components/schemas/NullableDate' }
        due_date: { $ref: '#/components/schemas/Date' }
        parent_id: { type: [integer, 'null'] }
        status_id: { type: integer }
        created_by: { type: integer }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    ProjectListItem:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            status_name: { type: string }
            created_by_name: { type: string }
            estimated_time: { $ref: '#/components/schemas/NumericString' }
            spent_time: { $ref: '#/components/schemas/NumericString' }
            progress: { $ref: '#/components/schemas/NumericString' }
    ProjectDetails:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, 'null'] }
        start_date: { $ref: '#/components/schemas/Date' }
        end_date: { $ref: '#/components/schemas/NullableDate' }
        due_date: { $ref: '#/components/schemas/Date' }
        parent_id: { type: [integer, 'null'] }
        parent_name: { type: [string, 'null'] }
        status_id: { type: integer }
        status_name: { type: string }
        created_by: { type: integer }
        created_by_name: { type: string }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        estimated_time: { $ref: '#/components/schemas/NumericString' }
        spent_time: { $ref: '#/components/schemas/NumericString' }
        progress: { $ref: '#/components/schemas/NumericString' }
    Subproject:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            status: { type: string }
            created_by_name: { type: string }
            parent_name: { type: [string, 'null'] }
    ProjectCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: [string, 'null'] }
        start_date: { $ref: '#/components/schemas/Date' }
        due_date: { $ref: '#/components/schemas/Date' }
        parent_id: { type: [integer, 'null'], minimum: 1 }
    ProjectUpdateInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 50 }
        description: { type: [string, 'null'] }
        start_date: { $ref: '#/components/schemas/Date' }
        due_date: { $ref: '#/components/schemas/Date' }
        parent_id:
          type: [integer, 'null']
          minimum: 1
          description: '`null` detaches the project from its parent.'
    ProjectMember:
      type: object
      properties:
        project_id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        surname: { type: string }
        role: { type: string }
    ProjectMembership:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: integer }
        user_id: { type: integer }
        created_on: { $ref: '#/components/schemas/Timestamp' }

    Task:
      type: object
      description: A raw `tasks` row.
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'] }
        estimated_time: { oneOf: [{ $ref: '#/components/schemas/NumericString' }, { type: 'null' }] }
        start_date: { $ref: '#/components/schemas/Date' }
        due_date: { $ref: '#/components/schemas/Date' }
        end_date: { $ref: '#/components/schemas/NullableDate' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        priority_id: { type: integer }
        status_id: { type: integer }
        type_id: { type: integer }
        parent_id: { type: [integer, 'null'] }
        project_id: { type: integer }
        holder_id: { type: [integer, 'null'] }
        assignee_id: { type: [integer, 'null'] }
        created_by: { type: integer }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    TaskDetails:
      type: object
      description: A task with the names and colours of related records.
      properties:
        id: { type: integer }
        name: { type: string }
        project_id: { type: integer }
        project_name: { type: string }
        holder_id: { type: [integer, 'null'] }
        holder_name: { type: [string, 'null'] }
        assignee_id: { type: [integer, 'null'] }
        assignee_name: { type: [string, 'null'] }
        parent_id: { type: [integer, 'null'] }
        parent_name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        type_id: { type: integer }
        type_name: { type: string }
        type_color: { type: [string, 'null'] }
        type_icon: { type: [string, 'null'] }
        status_id: { type: integer }
        status_name: { type: string }
        status_color: { type: [string, 'null'] }
        priority_id: { type: integer }
        priority_name: { type: string }
        priority_color: { type: [string, 'null'] }
        start_date: { $ref: '#/components/schemas/Date' }
        due_date: { $ref: '#/components/schemas/Date' }
        end_date: { $ref: '#/components/schemas/NullableDate' }
        spent_time: { $ref: '#/components/schemas/NumericString' }
        progress: { type: integer }
        created_by: { type: integer }
        created_by_name: { type: string }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        estimated_time: { oneOf: [{ $ref: '#/components/schemas/NumericString' }, { type: 'null' }] }
    TaskCreateInput:
      type: object
      required:
        - name
        - start_date
        - due_date
        - priority_id
        - status_id
        - type_id
        - project_id
        - holder_id
        - assignee_id
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'] }
        estimated_time: { type: [number, 'null'], minimum: 0, maximum: 999.99 }
        start_date: { $ref: '#/components/schemas/Date' }
        due_date: { $ref: '#/components/schemas/Date' }
        end_date: { $ref: '#/components/schemas/NullableDate' }
        priority_id: { type: integer }
        status_id: { type: integer }
        type_id: { type: integer }
        project_id: { type: integer }
        parent_id: { type: [integer, 'null'] }
        holder_id: { type: integer }
        assignee_id: { type: integer }
        tags:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: integer }
    TaskUpdateInput:
      type: object
      description: Unknown keys are ignored.
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: [string, 'null'] }
        estimated_time: { type: [number, 'null'], minimum: 0, maximum: 999.99 }
        start_date: { $ref: '#/components/schemas/Date' }
        due_date: { $ref: '#/components/schemas/Date' }
        end_date: { $ref: '#/components/schemas/NullableDate' }
        priority_id: { type: integer }
        status_id: { type: integer }
        type_id: { type: integer }
        holder_id: { type: integer }
        assignee_id: { type: integer }
        progress: { type: integer, minimum: 0, maximum: 100 }

    CommentInput:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 1, maxLength: 400 }
    CommentRow:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        user_id: { type: integer }
        active: { type: boolean }
        comment: { type: string }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    Comment:
      allOf:
        - $ref: '#/components/schemas/CommentRow'
        - type: object
          properties:
            user_name: { type: string }

    FileRow:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        user_id: { type: integer }
        original_name: { type: string }
        stored_name: { type: string }
        size: { $ref: '#/components/schemas/NumericString' }
        mime_type: { type: string }
        file_path: { type: string }
        uploaded_on: { $ref: '#/components/schemas/Timestamp' }
    TaskFile:
      allOf:
        - $ref: '#/components/schemas/FileRow'
        - type: object
          properties:
            uploaded_by: { type: string, description: Uploader's display name. }

    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: string }
        icon: { type: string }
        active: { type: boolean }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    TagInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        icon: { type: string, pattern: '^[A-Za-z0-9]{1,50}$', default: Label }

    Watcher:
      type: object
      properties:
        task_id: { type: integer }
        user_id: { type: integer }
        user_name: { type: string }
        role: { type: string }
    WatcherRow:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        task_id: { type: integer }
        created_on: { $ref: '#/components/schemas/Timestamp' }

    Permission:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, 'null'] }
        active: { type: boolean }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    RoleInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: [string, 'null'] }
        active: { type: boolean, description: Update only. }
        permissions:
          type: array
          description: Permission ids; replaces the current set.
          items: { type: integer }
    RoleSaved:
      type: object
      required: [message, id]
      properties:
        message: { type: string }
        id: { type: [integer, string] }

    User:
      type: object
      properties:
        id: { type: integer }
        login: { type: string }
        name: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        status_id: { type: integer }
        role_id: { type: integer }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    UserListItem:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            status_name: { type: string }
            status_color: { type: [string, 'null'] }
            role_name: { type: string }
            last_login: { $ref: '#/components/schemas/NullableTimestamp' }
    UserOption:
      type: object
      properties:
        id: { type: integer }
        login: { type: string }
        name: { type: string }
        surname: { type: string }
    UserCreateInput:
      type: object
      required: [login, name, surname, email, password, role_id]
      properties:
        login: { type: string, maxLength: 255 }
        name: { type: string, maxLength: 255 }
        surname: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password:
          type: string
          format: password
          description: Must satisfy the password policy.
        role_id: { type: integer }
    UserUpdateInput:
      type: object
      properties:
        login: { type: string, maxLength: 255 }
        name: { type: string, maxLength: 255 }
        surname: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password:
          type: string
          format: password
          description: Must satisfy the password policy.
        role_id: { type: integer }
        status_id: { type: integer }

    Notification:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        type_id: { type: integer }
        title: { type: string }
        message: { type: string }
        link: { type: [string, 'null'] }
        data: { type: [object, 'null'] }
        is_read: { type: boolean }
        active: { type: boolean }
        read_on: { $ref: '#/components/schemas/NullableTimestamp' }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        type: { type: string }
        icon: { type: [string, 'null'] }
        color: { type: [string, 'null'] }

    Profile:
      type: object
      properties:
        id: { type: integer }
        login: { type: string }
        name: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        role_name: { type: string }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        last_login: { $ref: '#/components/schemas/NullableTimestamp' }
        total_tasks: { $ref: '#/components/schemas/NumericString' }
        completed_tasks: { $ref: '#/components/schemas/NumericString' }
        active_projects: { $ref: '#/components/schemas/NumericString' }
        total_hours: { $ref: '#/components/schemas/NumericString' }
    RecentTask:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        project_name: { type: string }
        holder_name: { type: [string, 'null'] }
        estimated_time: { oneOf: [{ $ref: '#/components/schemas/NumericString' }, { type: 'null' }] }
        start_date: { $ref: '#/components/schemas/Date' }
        due_date: { $ref: '#/components/schemas/Date' }
        status_name: { type: string }
        priority_name: { type: string }
        created_by_name: { type: string }
        priority_color: { type: [string, 'null'] }
    RecentProject:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        due_date: { $ref: '#/components/schemas/Date' }
        progress: { type: integer }

    SystemStats:
      type: object
      properties:
        active_users: { $ref: '#/components/schemas/NumericString' }
        active_projects: { $ref: '#/components/schemas/NumericString' }
        active_tasks: { $ref: '#/components/schemas/NumericString' }
        time_logs_30d: { $ref: '#/components/schemas/NumericString' }

    LookupTypeInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        icon:
          type: [string, 'null']
          description: One of the names from the matching `/icons` endpoint.
        description: { type: [string, 'null'] }
        active: { type: boolean }
    TaskType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, 'null'] }
        color: { type: string }
        icon: { type: string, default: TaskAlt }
        active: { type: boolean }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    ActivityType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, 'null'] }
        color: { type: string }
        icon: { type: [string, 'null'] }
        active: { type: boolean }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }

    Theme:
      type: string
      enum: [light, dark, system]
    AppSettings:
      type: object
      properties:
        id: { type: integer }
        app_name: { type: string }
        company_name: { type: [string, 'null'] }
        sender_email: { type: [string, 'null'] }
        time_zone: { type: string }
        theme: { $ref: '#/components/schemas/Theme' }
        welcome_message: { type: [string, 'null'] }
        app_base_url: { type: [string, 'null'] }
        log_level: { type: string, enum: [error, warn, info, debug] }
        email_enabled: { type: boolean }
        email_host: { type: [string, 'null'] }
        email_port: { type: [integer, 'null'] }
        email_secure: { type: boolean }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    AppSettingsInput:
      type: object
      description: Only the given keys change.
      properties:
        app_name: { type: string, minLength: 1, maxLength: 255 }
        company_name: { type: string, minLength: 1, maxLength: 255 }
        sender_email: { type: string, minLength: 1, maxLength: 255 }
        time_zone: { type: string, minLength: 1, maxLength: 255 }
        theme: { $ref: '#/components/schemas/Theme' }
        welcome_message: { type: string, maxLength: 20000 }
        app_base_url: { type: string, minLength: 1, maxLength: 255 }
        log_level: { type: string, enum: [error, warn, info, debug] }
        email_enabled: { type: boolean }
        email_host: { type: string, minLength: 1, maxLength: 255 }
        email_port: { type: integer, minimum: 1, maximum: 65535 }
        email_secure: { type: boolean }
    Timezone:
      type: object
      properties:
        name: { type: string, examples: [Europe/Zagreb] }
        region: { type: string }
        abbrev: { type: string }
        utcOffsetSeconds: { type: integer }
        isDst: { type: boolean }
        label: { type: string }
    UserSettings:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        theme: { $ref: '#/components/schemas/Theme' }
        language: { type: string }
        notifications_enabled: { type: boolean }
        email_notifications_enabled: { type: boolean }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    UserSettingsInput:
      type: object
      properties:
        theme: { $ref: '#/components/schemas/Theme' }
        language: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
        notifications_enabled: { type: boolean }
        email_notifications_enabled: { type: boolean }
        email_notifications:
          type: boolean
          description: Alias of `email_notifications_enabled`.
    SmtpTestResult:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
        messageId: { type: string }
        code: { type: string }

    TimeLog:
      type: object
      description: A raw `time_logs` row.
      properties:
        id: { type: integer }
        task_id: { type: integer }
        user_id: { type: integer }
        log_date: { $ref: '#/components/schemas/Date' }
        spent_time: { $ref: '#/components/schemas/NumericString' }
        description: { type: string }
        activity_type_id: { type: integer }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    TimeLogDetails:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: integer }
        project_name: { type: string }
        task_id: { type: integer }
        task_name: { type: string }
        user_id: { type: integer }
        user: { type: string, description: User's display name. }
        log_date: { $ref: '#/components/schemas/Date' }
        spent_time: { $ref: '#/components/schemas/NumericString' }
        description: { type: string }
        activity_type_id: { type: integer }
        activity_type_name: { type: string }
        activity_type_color: { type: string }
        activity_type_icon: { type: [string, 'null'] }
        created_on: { $ref: '#/components/schemas/Timestamp' }
        updated_on: { $ref: '#/components/schemas/NullableTimestamp' }
    TimeLogReportRow:
      allOf:
        - $ref: '#/components/schemas/TimeLog'
        - type: object
          properties:
            user_login: { type: string }
            activity_name: { type: string }
    TimeLogInput:
      type: object
      properties:
        log_date:
          $ref: '#/components/schemas/Date'
        spent_time:
          type: number
          exclusiveMinimum: 0
          maximum: 24
          description: Hours.
        description: { type: string }
        activity_type_id: { type: integer }
